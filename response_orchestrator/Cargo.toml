[package]
name = "response_orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
# High-performance async runtime for fast event processing
tokio = { version = "1.28", features = ["full"] }
# Zero-copy serialization for shared memory IPC
postcard = { version = "1.0", features = ["alloc"] }
# Safe system-level interaction (e.g., for network isolation)
nix = "0.26"
# Networking for external remediation calls
reqwest = { version = "0.11", features = ["json"] }
# Time handling
chrono = "0.4"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Interop with upstream Rust modules
serde_cbor = "0.11"
