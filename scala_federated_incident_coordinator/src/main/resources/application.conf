akka {
  actor {
    provider = "akka.remote.RemoteActorRefProvider"
  }
  remote {
    netty.tcp {
      hostname = "127.0.0.1"
      port = 2552
    }
  }
  stream.materializer {
    input-buffer {
      min-size = 16
      max-size = 1024
    }
  }
}

incident {
  coordinator {
    stream {
      buffer-size = 256
    }
  }
}

audit {
  logger {
    path = "audit.log"
  }
}
