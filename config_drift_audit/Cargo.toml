[package]
name = "config_drift_audit"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "5.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"

[dependencies.hume]
version = "0.1"
git = "https://github.com/hume-lang/hume"
