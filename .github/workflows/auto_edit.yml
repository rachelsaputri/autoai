name: AI Self-Prompting README Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Disarankan 15 menit agar tidak terkena rate-limit / abuse limit

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Self-Improving Loop
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          URL="https://ai.tioo.eu.org/v1/chat/completions"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Cek dan Handle Reset Topik (Jika README sudah > 350 baris)
          MAX_LINES=350
          CURRENT_LINES=0
          if [ -f README.md ]; then
            CURRENT_LINES=$(wc -l < README.md)
          fi

          if [ ! -f README.md ] || [ "$CURRENT_LINES" -ge "$MAX_LINES" ]; then
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            
            # Arsipkan README lama jika sudah terlalu panjang
            if [ -f README.md ] && [ "$CURRENT_LINES" -ge "$MAX_LINES" ]; then
              mkdir -p archives
              mv README.md "archives/README_$TIMESTAMP.md"
              echo "README mencapai $CURRENT_LINES baris. Diarsipkan ke archives/README_$TIMESTAMP.md"
            fi

            # Inisialisasi Topik Baru
            echo "# Knowledge Base & AI Documentation Hub" > README.md
            echo "> *Terakhir di-reset: $(date +'%Y-%m-%d %H:%M:%S') UTC*" >> README.md
            echo -e "\n## Daftar Isi & Modul\nDokumentasi ini dibuat dan diperluas secara otonom oleh AI.\n" >> README.md
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] TOPIC_RESET: Memulai modul topik baru." >> history.txt
          fi

          # Loop iterasi
          for i in {1..3}
          do
            echo "--- Iterasi ke-$i ---"
            
            # Ambil konteks ringkas (maksimal 20 baris terakhir)
            HISTORY_CONTEXT=$(tail -n 15 history.txt 2>/dev/null | tr '\n' ' ' | sed 's/"/\\"/g')
            README_CONTEXT=$(tail -n 25 README.md | tr '\n' ' ' | sed 's/"/\\"/g')

            # 1. AI Generate Prompt Lanjutan / Sub-topik
            PROMPT_PAYLOAD=$(jq -n \
              --arg model "MiniMaxAI/MiniMax-M2.7" \
              --arg history "$HISTORY_CONTEXT" \
              --arg readme "$README_CONTEXT" \
              '{
                model: $model,
                messages: [
                  {
                    role: "system",
                    content: "Anda adalah perancang silabus teknis. Buat 1 prompt tugas spesifik untuk menulis bab dokumentasi lanjutan (misal: Arsitektur, Best Practices, Security, Kode Contoh, Optimasi). HANYA kembalikan teks instruksi tugasnya tanpa pembuka/penutup."
                  },
                  {
                    role: "user",
                    content: ("Konteks dokumentasi saat ini:\n" + $readme + "\n\nRiwayat modul sebelumnya:\n" + $history + "\n\nBuat sub-topik berikutnya yang paling relevan.")
                  }
                ]
              }')

            NEW_PROMPT_RESP=$(curl -s -X POST "$URL" \
              -H "Authorization: Bearer $OPENAI_KEY" \
              -H "Content-Type: application/json" \
              -d "$PROMPT_PAYLOAD")

            # Validasi respon JSON agar tidak crash
            if echo "$NEW_PROMPT_RESP" | jq empty 2>/dev/null; then
              GENERATED_PROMPT=$(echo "$NEW_PROMPT_RESP" | jq -r '.choices[0].message.content // empty')
            else
              echo "Error: Respon API bukan JSON valid: $NEW_PROMPT_RESP"
              GENERATED_PROMPT=""
            fi

            if [ -z "$GENERATED_PROMPT" ]; then
              GENERATED_PROMPT="Tuliskan bab lanjutan mengenai Arsitektur Sistem, Flowchart logic, dan Contoh Implementasi teknisnya."
            fi

            echo "[$(date +'%Y-%m-%d %H:%M:%S')] $GENERATED_PROMPT" >> history.txt

            # 2. AI Generate Konten Dokumentasi
            CONTENT_PAYLOAD=$(jq -n \
              --arg model "MiniMaxAI/MiniMax-M2.7" \
              --arg prompt "$GENERATED_PROMPT" \
              --arg readme "$README_CONTEXT" \
              '{
                model: $model,
                messages: [
                  {
                    role: "system",
                    content: "Anda adalah Technical Documentation Engineer. Buat modul dokumentasi Markdown yang sangat informatif, rapi dengan heading H2/H3, tabel/bullet-points, dan diagram/code blocks bila perlu. Jangan ulangi teks pembuka README."
                  },
                  {
                    role: "user",
                    content: ("README saat ini berakhir di:\n" + $readme + "\n\nTugas penulisan modul baru:\n" + $prompt + "\n\nTuliskan kontennya dalam Markdown valid:")
                  }
                ]
              }')

            NEW_CONTENT_RESP=$(curl -s -X POST "$URL" \
              -H "Authorization: Bearer $OPENAI_KEY" \
              -H "Content-Type: application/json" \
              -d "$CONTENT_PAYLOAD")

            # Validasi respon JSON kedua
            if echo "$NEW_CONTENT_RESP" | jq empty 2>/dev/null; then
              GENERATED_CONTENT=$(echo "$NEW_CONTENT_RESP" | jq -r '.choices[0].message.content // empty')
            else
              echo "Error: Respon API konten bukan JSON valid: $NEW_CONTENT_RESP"
              GENERATED_CONTENT=""
            fi

            if [ -n "$GENERATED_CONTENT" ]; then
              echo -e "\n\n---\n\n$GENERATED_CONTENT" >> README.md

              git pull origin main --rebase || true
              git add history.txt README.md archives/ 2>/dev/null || true
              git commit -m "docs(ai): update modules & expand docs [$(date +'%H:%M:%S')]" || true
              git push || echo "Push gagal, akan dicoba pada iterasi berikutnya."
            fi

            sleep 15
          done
