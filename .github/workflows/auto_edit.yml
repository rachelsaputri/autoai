name: AI Self-Prompting README Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Self-Improving Loop
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          URL="https://ai.tioo.eu.org/v1/chat/completions"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f history.txt ]; then
            echo "Initial topic: Autonomous AI system development and knowledge base." > history.txt
          fi
          if [ ! -f README.md ]; then
            echo "# AI Self-Improving Documentation" > README.md
          fi
          TOPICS=(
            "AI Ethics and Safety"
            "The Future of AI and Automation"
            "Advanced Prompt Engineering Techniques"
            "Machine Learning vs Deep Learning Fundamentals"
            "Introduction to Retrieval-Augmented Generation (RAG)"
            "LLM Performance and Context Optimization"
            "Real-World AI Industry Applications"
          )
          for i in {1..6}
          do
            HISTORY_CONTEXT=$(tail -n 20 history.txt | tr '\n' ' ')
            README_CONTEXT=$(tail -n 30 README.md | tr '\n' ' ')
            RESET_CHANCE=$((RANDOM % 5))
            if [ $RESET_CHANCE -eq 0 ]; then
              RANDOM_TOPIC="${TOPICS[$RANDOM % ${#TOPICS[@]}]}"
              GENERATED_PROMPT="Disregard the previous context. Create a completely NEW, highly detailed, and informative chapter about: '$RANDOM_TOPIC'. Use markdown headings (##) for this new chapter."
            else
              PROMPT_PAYLOAD=$(jq -n \
                --arg model "MiniMaxAI/MiniMax-M2.7" \
                --arg history "$HISTORY_CONTEXT" \
                --arg readme "$README_CONTEXT" \
                '{
                  model: $model,
                  messages: [
                    {
                      role: "user",
                      content: ("Based on the following prompt history:\n" + $history + "\n\nAnd the latest README content:\n" + $readme + "\n\nGenerate exactly 1 logical follow-up prompt to continue, deepen, or expand the current README content. Return ONLY the new prompt text without any explanations, tags, or conversational filler.")
                    }
                  ]
                }')
              NEW_PROMPT_RESP=$(curl -s -X POST "$URL" \
                -H "Authorization: Bearer $OPENAI_KEY" \
                -H "Content-Type: application/json" \
                -d "$PROMPT_PAYLOAD")
              GENERATED_PROMPT=$(echo "$NEW_PROMPT_RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null | perl -0777 -pe 's/<think>.*?<\/think>\s*//gs' || echo "")
            fi
            if [ -z "$GENERATED_PROMPT" ]; then
              GENERATED_PROMPT="Continue the previous topic by providing more detailed technical explanations, best practices, and real-world examples."
            fi
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] $GENERATED_PROMPT" >> history.txt
            CONTENT_PAYLOAD=$(jq -n \
              --arg model "MiniMaxAI/MiniMax-M2.7" \
              --arg prompt "$GENERATED_PROMPT" \
              --arg readme "$README_CONTEXT" \
              '{
                model: $model,
                messages: [
                  {
                    role: "system",
                    content: "You are an expert technical documentation writer. Write comprehensive, well-structured, and highly informative continuation content. Ensure seamless flow with the previous content. Use markdown formatting like headings, lists, or tables where appropriate to enhance readability."
                  },
                  {
                    role: "user",
                    content: ("Current README context:\n" + $readme + "\n\nYour task:\n" + $prompt + "\n\nWrite the next section to be appended to the README.md. Output strictly the raw Markdown text only. Do not include markdown code block backticks around the entire output.")
                  }
                ]
              }')
            NEW_CONTENT_RESP=$(curl -s -X POST "$URL" \
              -H "Authorization: Bearer $OPENAI_KEY" \
              -H "Content-Type: application/json" \
              -d "$CONTENT_PAYLOAD")
            GENERATED_CONTENT=$(echo "$NEW_CONTENT_RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null | perl -0777 -pe 's/<think>.*?<\/think>\s*//gs' || echo "")
            if [ -n "$GENERATED_CONTENT" ]; then
              echo -e "\n\n$GENERATED_CONTENT" >> README.md
              git add history.txt README.md
              git commit -m "docs: expand README & update prompt history [$(date +'%H:%M:%S')]" || true
              git push || true
            fi
            sleep 30
          done
