name: AI Self-Prompting README Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Self-Improving Loop
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          URL="https://ai.tioo.eu.org/v1/chat/completions"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Buat file history.txt jika belum ada
          if [ ! -f history.txt ]; then
            echo "Mulai dari topik awal: Pengembangan sistem AI mandiri dan basis pengetahuan." > history.txt
          fi

          # Buat file README.md jika belum ada
          if [ ! -f README.md ]; then
            echo "# Dokumentasi AI Self-Improving" > README.md
          fi

          # Daftar topik untuk Reset agar README informatif & tidak monoton
          TOPICS=(
            "Etika dan Keamanan Penggunaan AI"
            "Masa Depan AI dan Otomatisasi"
            "Tips Melakukan Prompt Engineering"
            "Perbedaan Dasar Machine Learning dan Deep Learning"
            "Apa itu RAG (Retrieval-Augmented Generation)?"
            "Optimasi Kinerja Model AI (LLM)"
            "Contoh Penerapan AI di Industri Nyata"
          )

          for i in {1..6}
          do
            # Read last entries from history and README
            HISTORY_CONTEXT=$(tail -n 20 history.txt | tr '\n' ' ')
            README_CONTEXT=$(tail -n 30 README.md | tr '\n' ' ')

            # LOGIKA RESET TOPIK: 20% kemungkinan AI akan dipaksa ganti topik baru
            RESET_CHANCE=$((RANDOM % 5))
            
            if [ $RESET_CHANCE -eq 0 ]; then
              # Ambil topik acak dari array TOPICS
              RANDOM_TOPIC="${TOPICS[$RANDOM % ${#TOPICS[@]}]}"
              GENERATED_PROMPT="Abaikan diskusi sebelumnya. Buatlah bab BARU yang sangat detail dan informatif tentang: '$RANDOM_TOPIC'. Gunakan heading markdown (##) untuk judul bab ini."
            else
              # 1. Normal Flow: AI Generate Prompt Baru berdasarkan history dan README
              PROMPT_PAYLOAD=$(jq -n \
                --arg model "MiniMaxAI/MiniMax-M2.7" \
                --arg history "$HISTORY_CONTEXT" \
                --arg readme "$README_CONTEXT" \
                '{
                  model: $model,
                  messages: [
                    {
                      role: "user",
                      content: ("Berdasarkan riwayat prompt berikut:\n" + $history + "\n\nDan isi README terakhir:\n" + $readme + "\n\nBuatlah 1 perintah/prompt baru yang logis untuk melanjutkan, memperdalam, atau memperluas konten README tersebut. Berikan HANYA teks prompt baru tersebut tanpa penjelasan tambahan.")
                    }
                  ]
                }')

              NEW_PROMPT_RESP=$(curl -s -X POST "$URL" \
                -H "Authorization: Bearer $OPENAI_KEY" \
                -H "Content-Type: application/json" \
                -d "$PROMPT_PAYLOAD")

              # FIX: Tambahkan error suppression untuk jq agar tidak crash saat API mengembalikan error web (bukan JSON)
              GENERATED_PROMPT=$(echo "$NEW_PROMPT_RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
            fi

            # Fallback jika jq gagal membaca (misal saat server API down)
            if [ -z "$GENERATED_PROMPT" ]; then
              GENERATED_PROMPT="Lanjutkan pembahasan materi sebelumnya dengan memberikan penjelasan teknis yang lebih detail beserta contohnya."
            fi

            # Catat prompt ke history.txt
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] $GENERATED_PROMPT" >> history.txt

            # 2. AI Generate Konten README
            CONTENT_PAYLOAD=$(jq -n \
              --arg model "MiniMaxAI/MiniMax-M2.7" \
              --arg prompt "$GENERATED_PROMPT" \
              --arg readme "$README_CONTEXT" \
              '{
                model: $model,
                messages: [
                  {
                    role: "system",
                    content: "Anda adalah penulis dokumentasi teknis. Tuliskan konten lanjutan yang komprehensif, terstruktur, gunakan list atau tabel jika perlu, dan langsung menambah nilai informasi."
                  },
                  {
                    role: "user",
                    content: ("Konten README saat ini:\n" + $readme + "\n\nTugas:\n" + $prompt + "\n\nTuliskan bab/materi lanjutan untuk ditempel ke README.md. Gunakan format Markdown yang rapi.")
                  }
                ]
              }')

            NEW_CONTENT_RESP=$(curl -s -X POST "$URL" \
              -H "Authorization: Bearer $OPENAI_KEY" \
              -H "Content-Type: application/json" \
              -d "$CONTENT_PAYLOAD")

            # FIX: Error suppression untuk JSON parsing konten
            GENERATED_CONTENT=$(echo "$NEW_CONTENT_RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")

            if [ -n "$GENERATED_CONTENT" ]; then
              echo -e "\n\n$GENERATED_CONTENT" >> README.md

              git add history.txt README.md
              # Tambahkan || true agar tidak gagal jika tidak ada perubahan baru
              git commit -m "docs: expand README & update prompt history [$(date +'%H:%M:%S')]" || true
              git push || true
            fi

            # Jeda antar request untuk menghindari rate-limit
            sleep 30
          done
