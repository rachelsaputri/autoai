name: Autonomous AI Badge Farmer

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  auto-develop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Autonomous Engineering Loop
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          URL="https://ai.tioo.eu.org/v1/chat/completions"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ ! -f history.txt ]; then
            echo "Initialization: Ultimate Polyglot system boot (Sequential + Full Code Mode)." > history.txt
          fi
          if [ ! -f README.md ]; then
            echo "# Autonomous AI Ultimate Polyglot Knowledgebase" > README.md
          fi
          if [ ! -f lang_index.txt ]; then
            echo "1" > lang_index.txt
          fi
          
          # Download dan bersihkan daftar bahasa ke file sementara
          curl -s "https://gist.githubusercontent.com/calvinfroedge/defeb8fc6cdc0068e172/raw/7904b2504827f6f4883df0299a2bf51accbe9dab/languages.json" | sed 's/","/\n/g' | tr -d '[]"' > /tmp/all_langs.txt
          TOTAL_LANGS=$(wc -l < /tmp/all_langs.txt)
          
          TOPICS=(
            "Develop a complex data extraction or parsing utility."
            "Implement a fully working mathematical or cryptographic algorithm."
            "Create an interactive, fully functioning diagnostic tool."
            "Build a robust data transfer or API interaction script."
            "Write a working low-level memory management or network protocol simulator."
            "Design a complete, automated dataset cleaning or text formatting tool."
            "Create a self-healing tool with proper error handling and real logic."
          )
          
          for i in {1..6}
          do
            # Pastikan selalu berada di branch main dan mendapatkan data terbaru
            git checkout main
            git pull origin main || true
            
            HISTORY_CONTEXT=$(tail -n 20 history.txt | tr '\n' ' ')
            README_CONTEXT=$(tail -n 30 README.md | tr '\n' ' ')
            DIR_STRUCTURE=$(find . -maxdepth 4 -not -path '*/\.git/*' -not -path '*/\.github/*' | sort | tr '\n' ' | ')
            
            # Ambil bahasa secara BERURUTAN berdasarkan index saat ini
            CURRENT_INDEX=$(cat lang_index.txt)
            TARGET_LANG=$(sed "${CURRENT_INDEX}q;d" /tmp/all_langs.txt)
            
            # Pindahkan bookmark/index ke angka selanjutnya
            NEXT_INDEX=$((CURRENT_INDEX + 1))
            if [ "$NEXT_INDEX" -gt "$TOTAL_LANGS" ]; then
              NEXT_INDEX=1
            fi
            echo "$NEXT_INDEX" > lang_index.txt
            
            RESET_CHANCE=$((RANDOM % 5))
            if [ $RESET_CHANCE -eq 0 ]; then
              RANDOM_TOPIC="${TOPICS[$RANDOM % ${#TOPICS[@]}]}"
              GENERATED_PROMPT="Focus entirely on this new objective: '$RANDOM_TOPIC'. You MUST write complex, fully functional, and production-ready code strictly using this programming language: $TARGET_LANG. No dummy code. Workspace: $DIR_STRUCTURE."
            else
              PROMPT_PAYLOAD=$(jq -n \
                --arg model "Qwen3.6-35B-A3B-FP8" \
                --arg history "$HISTORY_CONTEXT" \
                --arg dirs "$DIR_STRUCTURE" \
                --arg lang "$TARGET_LANG" \
                '{
                  model: $model,
                  messages: [
                    {
                      role: "user",
                      content: ("You are an Autonomous AI. Workspace:\n" + $dirs + "\n\nHistory:\n" + $history + "\n\nGenerate exactly 1 logical follow-up instruction. You MUST explicitly demand that the new tool be built STRICTLY using this exact programming language: " + $lang + ". Demand a fully functional, complete implementation (NO dummy code, NO placeholders). If building a new tool, explicitly instruct to place it in a NEW dedicated folder and create a local README.md. Return ONLY the instruction text. NEVER target the .github directory.")
                    }
                  ]
                }')
              NEW_PROMPT_RESP=$(curl -s -X POST "$URL" \
                -H "Authorization: Bearer $OPENAI_KEY" \
                -H "Content-Type: application/json" \
                -d "$PROMPT_PAYLOAD")
              GENERATED_PROMPT=$(echo "$NEW_PROMPT_RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null | perl -0777 -pe 's/<think>.*?<\/think>\s*//gs' || echo "")
            fi
            
            if [ -z "$GENERATED_PROMPT" ]; then
              GENERATED_PROMPT="Create a complete, fully functional utility for data processing in a new folder. You MUST write it strictly in $TARGET_LANG. Absolutely NO dummy code or placeholders. Include a local README.md."
            fi
            
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] (Target Lang: $TARGET_LANG) $GENERATED_PROMPT" >> history.txt
            
            CONTENT_PAYLOAD=$(jq -n \
              --arg model "Qwen3.6-35B-A3B-FP8" \
              --arg prompt "$GENERATED_PROMPT" \
              --arg dirs "$DIR_STRUCTURE" \
              --arg lang "$TARGET_LANG" \
              '{
                model: $model,
                response_format: { type: "json_object" },
                messages: [
                  {
                    role: "system",
                    content: ("You are an elite Autonomous AI Polyglot Software Engineer. Workspace: " + $dirs + ". You MUST NEVER create or modify files inside the .github directory. You MUST strictly write the code in the exact programming language requested: " + $lang + ". Using Python or any other default language instead of " + $lang + " is strictly forbidden. \n\nCRITICAL INSTRUCTION: The code you write MUST be completely functional, logically sound, and production-ready. You are STRICTLY FORBIDDEN from writing dummy code, theoretical snippets, placeholders, or \"TODO\" comments. The tools must work out of the box with real logic.\n\nWhenever you create a tool, you MUST generate a README.md file INSIDE that specific folder. You MUST respond strictly in valid JSON format containing a single key \"files\" which is an ARRAY of objects. Each object must have exactly two keys: \n1. \"filepath\": The relative path. \n2. \"content\": The raw, functional code or markdown text. Do NOT wrap content in markdown code blocks.")
                  },
                  {
                    role: "user",
                    content: ("Execute task:\n" + $prompt)
                  }
                ]
              }')
              
            NEW_CONTENT_RESP=$(curl -s -X POST "$URL" \
              -H "Authorization: Bearer $OPENAI_KEY" \
              -H "Content-Type: application/json" \
              -d "$CONTENT_PAYLOAD")
              
            RAW_JSON=$(echo "$NEW_CONTENT_RESP" | jq -r '.choices[0].message.content // empty' 2>/dev/null | perl -0777 -pe 's/<think>.*?<\/think>\s*//gs')
            
            if echo "$RAW_JSON" | jq -e . >/dev/null 2>&1; then
              BRANCH_NAME="patch-$(date +'%s')-$RANDOM"
              git checkout -b "$BRANCH_NAME"
              
              FILE_COUNT=$(echo "$RAW_JSON" | jq '.files | length' 2>/dev/null || echo "0")
              for (( j=0; j<$FILE_COUNT; j++ )); do
                FILEPATH=$(echo "$RAW_JSON" | jq -r ".files[$j].filepath // empty")
                CODE_CONTENT=$(echo "$RAW_JSON" | jq -r ".files[$j].content // empty")
                if [ -n "$FILEPATH" ] && [ -n "$CODE_CONTENT" ] && [ "$FILEPATH" != "null" ] && [ "$CODE_CONTENT" != "null" ]; then
                  if [[ "$FILEPATH" == *.github* ]]; then
                    echo "Blocked .github modification."
                  else
                    DIRNAME=$(dirname "$FILEPATH")
                    mkdir -p "$DIRNAME"
                    echo "$CODE_CONTENT" > "$FILEPATH"
                    if [[ "$FILEPATH" == *README.md* && "$FILEPATH" != "README.md" ]]; then
                      echo -e "\n- Created/Updated module: \`$DIRNAME\` (See \`$FILEPATH\` for details)" >> README.md
                    fi
                    git add "$FILEPATH"
                  fi
                fi
              done
              
              # Wajib memasukkan lang_index.txt agar antrean bahasa tersimpan
              git add history.txt README.md lang_index.txt
              
              if git commit -m "feat(ai): autonomous update via PR for $FILE_COUNT files [$(date +'%H:%M:%S')]" -m "Co-authored-by: BOTCAHX <tioclkp02@gmail.com>"; then
                git push -u origin "$BRANCH_NAME"
                
                gh pr create --title "feat(ai): full tool implementation in $TARGET_LANG" --body "Automated fully functional tool creation using $TARGET_LANG. This PR is auto-generated and merged by AI." --base main --head "$BRANCH_NAME"
                
                gh pr merge "$BRANCH_NAME" --merge --delete-branch
                
                echo "Successfully merged PR for $BRANCH_NAME!"
              fi
            fi
            sleep 30
          done
