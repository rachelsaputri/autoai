[package]
name = "alert_dispatch_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
async-trait = "0.1"
serde_yaml = "0.9"

[[bin]]
name = "alert_dispatch_engine"
path = "src/main.rs"
