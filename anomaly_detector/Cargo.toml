[package]
name = "anomaly_detector"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
ndarray = "0.15"
rand = "0.8"

[[bin]]
name = "anomaly_engine"
path = "src/main.rs"
