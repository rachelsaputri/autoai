[package]
name = "correlation_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"

[dependencies.async-trait]
version = "0.1"

[dependencies.futures]
version = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
