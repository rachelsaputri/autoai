[package]
name = "config_validator_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
toml = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
