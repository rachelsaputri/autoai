# DC Compliance Data Processor Configuration
# Format: key=value

# Input settings
input_delimiter=|
field_count=6
required_fields=record_id,status,severity

# Validation settings
strict_mode=1
allow_empty_records=0
validate_timestamps=1
validate_severity_levels=HIGH,MEDIUM,LOW,CRITICAL

# Transformation settings
normalize_timestamps=1
timestamp_format=%Y-%m-%d
uppercase_severity=1
trim_whitespace=1

# Report settings
output_format=structured
include_metadata=1
include_summary=1
sort_output=0
sort_field=timestamp

# Error handling
max_errors_before_abort=0
log_errors=1
error_log_file=/dev/stderr

# Summary settings
count_by_severity=1
count_by_status=1
output_summary=1
